<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b96dc"/>
      <stop offset="0.35" stop-color="#78b6ea"/>
      <stop offset="0.78" stop-color="#a6d3f3"/>
      <stop offset="1" stop-color="#e2f1fa"/>
    </linearGradient>
    <radialGradient id="sun" cx="1380" cy="560" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf2" stop-opacity="1"/>
      <stop offset="0.05" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#fff2cf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c0e2"/>
      <stop offset="0.1" stop-color="#4598cb"/>
      <stop offset="0.5" stop-color="#2077b0"/>
      <stop offset="1" stop-color="#0e5388"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glint" cx="1380" cy="760" r="420" gradientUnits="userSpaceOnUse">
