      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="softer" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="wave"><feGaussianBlur stdDeviation="1.2"/></filter>
