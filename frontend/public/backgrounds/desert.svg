      <stop offset="0.82" stop-color="#c7e3f4"/>
      <stop offset="1" stop-color="#f4ecdc"/>
    </linearGradient>
    <radialGradient id="sun" cx="520" cy="430" r="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.05" stop-color="#fff7dc" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#fff0cc" stop-opacity="0.32"/>
